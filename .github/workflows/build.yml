name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.23.0
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2.23.0
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - name: Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Android release signing requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
      - name: Build one APK per CPU architecture
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Rename
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "MoonCalendar-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: MoonCalendar-android-apk
          path: build/app/outputs/flutter-apk/MoonCalendar-android-*.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.23.0
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value) }
          "MOONCALENDAR_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MoonCalendar-windows-x64.zip
      - name: Inno Setup
        shell: pwsh
        run: |
          # The usual setup: the compiler that ships with the runner image, installed from Chocolatey when missing.
          function Find-Iscc {
            @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          $exe = Find-Iscc
          if (-not $exe) {
            choco install innosetup -y --no-progress
            $exe = Find-Iscc
          }
          if (-not $exe) { throw "Inno Setup compiler not found" }
          Write-Host "Inno Setup compiler: $exe"
          # ISCC.exe carries no file version. The compiler prints its own version while it compiles
          # ("Compiler engine version: Inno Setup 6.x.x"), so that line is the reliable record.
          $log = & $exe windows/installer/Mooncalendar.iss 2>&1 | Tee-Object -Variable compileLog | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $version = ''
          if ($log -match 'Inno Setup\s+(\d+\.\d+(\.\d+)*)') { $version = $Matches[1] }
          Write-Host "Inno Setup version used: $version"
          # A new major version is a deliberate upgrade, not something a runner image update should do silently.
          if (-not $version.StartsWith('6.')) { throw "Unexpected Inno Setup version '$version' (expected 6.x)" }
          Move-Item "windows/installer/Output/MoonCalendar-Setup-x64.exe" "MoonCalendar-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: MoonCalendar-windows-x64
          path: |
            MoonCalendar-windows-x64.zip
            MoonCalendar-windows-x64-setup.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2.23.0
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack
        run: tar -C build/linux/x64/release/bundle -czf MoonCalendar-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: MoonCalendar-linux-x64
          path: MoonCalendar-linux-x64.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.23.0
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/MoonCalendar-macos.zip"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: MoonCalendar-macos
          path: MoonCalendar-macos.zip

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    continue-on-error: true   # needs signing to install; kept as a compile check + unsigned .ipa
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.23.0
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Unsigned IPA
        run: |
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MoonCalendar-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: MoonCalendar-ios-unsigned
          path: MoonCalendar-ios-unsigned.ipa

  web:
    name: Web
    runs-on: ubuntu-latest
    continue-on-error: true   # some desktop-only plugins may not compile for the web yet
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: subosito/flutter-action@v2.23.0
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build web --release
      - run: tar -C build/web -czf MoonCalendar-web.tar.gz .
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: MoonCalendar-web
          path: MoonCalendar-web.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2.2.2
        with:
          files: dist/*
          generate_release_notes: true
