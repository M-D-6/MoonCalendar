name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # A fixed signing key lets each APK update the previous one. Secret: ANDROID_KEYSTORE_BASE64.
      - name: Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] && [ -z "$KEYSTORE_PASSWORD" ] && [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Android signing secrets are required for tagged releases. Refusing to publish an APK signed by the debug key, which cannot update the installed app."
              exit 1
            fi
            echo "::warning::Android signing secrets are absent on this non-release build; the APK will use a debug key and is not suitable for public releases."
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Android signing configuration is partial. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD together."
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks; then
            echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded."
            exit 1
          fi
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
      - name: Build one APK per CPU architecture
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Rename
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "MoonCalendar-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-android-apk
          path: build/app/outputs/flutter-apk/MoonCalendar-android-*.apk

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      MOONCALENDAR_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with: { channel: stable, cache: true }
      # The setup action has no Windows Arm64 SDK, so the stable channel is cloned and must pick the arm64 Dart.
      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $flutterBin = "$env:RUNNER_TEMP\flutter\bin"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          & "$flutterBin\flutter.bat" --version
          $dart = & "$flutterBin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dart
          if ($dart -notmatch 'windows_arm64') { throw "Flutter picked a non-arm64 Dart SDK: $dart" }
      - run: flutter pub get
      - name: Verify release version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+(\d+)'
          if (-not $match) { throw "Could not parse app version from pubspec.yaml" }
          $declared = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
            if ($tagVersion -ne $declared) {
              throw "Release tag v$tagVersion does not match pubspec.yaml version $declared. Update all version metadata before tagging."
            }
            $v = $tagVersion
          } else {
            $v = $declared
          }
          "MOONCALENDAR_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: flutter build windows --release
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path "build/windows/${{ matrix.arch }}/runner/Release/*" -DestinationPath "MoonCalendar-windows-${{ matrix.arch }}.zip"
      - name: Inno Setup
        shell: pwsh
        run: |
          # The usual setup: the compiler that ships with the runner image, installed from Chocolatey when missing.
          function Find-Iscc {
            $command = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            $roots = @(${env:ProgramFiles(x86)}, $env:ProgramFiles, (Join-Path $env:LOCALAPPDATA 'Programs')) |
              Where-Object { $_ -and (Test-Path $_) }
            foreach ($root in $roots) {
              foreach ($dir in Get-ChildItem -Path $root -Directory -Filter 'Inno Setup*' -ErrorAction SilentlyContinue) {
                $candidate = Join-Path $dir.FullName 'ISCC.exe'
                if (Test-Path $candidate) { return $candidate }
              }
            }
            return $null
          }
          $exe = Find-Iscc
          if (-not $exe) {
            choco install innosetup -y --no-progress
            $exe = Find-Iscc
          }
          if (-not $exe) { throw "Inno Setup compiler not found" }
          Write-Host "Inno Setup compiler: $exe"
          # ISCC.exe carries no file version. The compiler prints its own version while it compiles
          # ("Compiler engine version: Inno Setup 6.x.x"), so that line is the reliable record.
          $log = & $exe windows/installer/Mooncalendar.iss 2>&1 | Tee-Object -Variable compileLog | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $version = ''
          if ($log -match 'Inno Setup\s+(\d+\.\d+(\.\d+)*)') { $version = $Matches[1] }
          Write-Host "Inno Setup version used: $version"
          # A new major version is a deliberate upgrade, not something a runner image update should do silently.
          if (-not $version.StartsWith('6.')) { throw "Unexpected Inno Setup version '$version' (expected 6.x)" }
          Move-Item "windows/installer/Output/MoonCalendar-Setup-${{ matrix.arch }}.exe" "MoonCalendar-windows-${{ matrix.arch }}-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-windows-${{ matrix.arch }}
          path: |
            MoonCalendar-windows-${{ matrix.arch }}.zip
            MoonCalendar-windows-${{ matrix.arch }}-setup.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack
        run: tar -C build/linux/x64/release/bundle -czf MoonCalendar-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-linux-x64
          path: MoonCalendar-linux-x64.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/MoonCalendar-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-macos
          path: MoonCalendar-macos.zip

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    continue-on-error: true   # needs signing to install; kept as a compile check + unsigned .ipa
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Unsigned IPA
        run: |
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MoonCalendar-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-ios-unsigned
          path: MoonCalendar-ios-unsigned.ipa

  web:
    name: Web
    runs-on: ubuntu-latest
    continue-on-error: true   # some desktop-only plugins may not compile for the web yet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build web --release
      - run: tar -C build/web -czf MoonCalendar-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-web
          path: MoonCalendar-web.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyze, android, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
