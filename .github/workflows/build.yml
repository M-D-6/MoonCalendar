name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
        continue-on-error: true   # the project has no tests yet

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # A fixed signing key lets each APK update the previous one. Secret: ANDROID_KEYSTORE_BASE64.
      - name: Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a temporary debug key and cannot update an installed release."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=mooncalendar"
            echo "keyAlias=mooncalendar"
            echo "keyPassword=mooncalendar"
          } > android/key.properties
      - name: Build one APK per CPU architecture
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
      - name: Rename
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            mv "$f" "MoonCalendar-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-android-apk
          path: build/app/outputs/flutter-apk/MoonCalendar-android-*.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value) }
          "MOONCALENDAR_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MoonCalendar-windows-x64.zip
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress }
          $exe = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { $exe = (Get-Command iscc).Source }
          & $exe windows/installer/Mooncalendar.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Move-Item "windows/installer/Output/MoonCalendar-Setup-x64.exe" "MoonCalendar-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-windows-x64
          path: |
            MoonCalendar-windows-x64.zip
            MoonCalendar-windows-x64-setup.exe

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libayatana-appindicator3-dev libkeybinder-3.0-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Pack
        run: tar -C build/linux/x64/release/bundle -czf MoonCalendar-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-linux-x64
          path: MoonCalendar-linux-x64.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip the app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent *.app "$GITHUB_WORKSPACE/MoonCalendar-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-macos
          path: MoonCalendar-macos.zip

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    continue-on-error: true   # needs signing to install; kept as a compile check + unsigned .ipa
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Unsigned IPA
        run: |
          mkdir -p Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr MoonCalendar-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-ios-unsigned
          path: MoonCalendar-ios-unsigned.ipa

  web:
    name: Web
    runs-on: ubuntu-latest
    continue-on-error: true   # some desktop-only plugins may not compile for the web yet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      - run: flutter build web --release
      - run: tar -C build/web -czf MoonCalendar-web.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: MoonCalendar-web
          path: MoonCalendar-web.tar.gz

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
