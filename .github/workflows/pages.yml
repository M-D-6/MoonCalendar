name: Deploy web to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/ci_prepare_platforms.sh
      - run: flutter pub get
      # The site is served from https://<user>.github.io/<repository>/, hence the base href.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      # Single-page fallback so that deep links do not end in a 404.
      - run: cp build/web/index.html build/web/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
